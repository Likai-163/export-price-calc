name: Update Central Parity Rate
on:
  schedule:
    - cron: '15 1 * * 1-5'
  workflow_dispatch:
jobs:
  update-rate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rate
        run: |
          RATE=$(curl -s 'https://www.chinamoney.com.cn/r/cms/www/chinamoney/data/fx/ccpr.json' | jq -r '.records[] | select(.vrtEName == "USD/CNY") | .price')
          if [ -z "$RATE" ] || [ "$RATE" = "null" ]; then echo "Fetch failed"; exit 0; fi
          echo "Rate: $RATE"
          D=$(date +%Y-%m-%d)
          printf '{"USD/CNY":%s,"date":"%s","source":"中国外汇交易中心","updated":"%sT09:15:00+08:00"}\n' "$RATE" "$D" "$D" > rate.json
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add rate.json
          git diff --staged --quiet || (git commit -m "Update central parity rate" && git push)
