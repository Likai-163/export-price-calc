name: Update Central Parity Rate

on:
  schedule:
    # 北京时间每天9:15后（UTC 1:15），中国外汇交易中心公布中间价
    # 交易日每天执行，非交易日获取到的是上一交易日数据
    - cron: '15 1 * * *'
  workflow_dispatch:

jobs:
  update-rate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch USD/CNY central parity rate from CFETS
        run: |
          API_URL='https://www.chinamoney.com.cn/r/cms/www/chinamoney/data/fx/ccpr.json'

          # 重试最多3次（CFETS API偶有波动）
          for i in 1 2 3; do
            echo "Attempt $i..."
            RESP=$(curl -s --max-time 15 "$API_URL") || { echo "curl failed, retrying..."; sleep 5; continue; }

            RATE=$(echo "$RESP" | jq -r '.records[] | select(.vrtEName == "USD/CNY") | .price // empty')
            LAST_DATE=$(echo "$RESP" | jq -r '.data.lastDate // empty')

            if [ -n "$RATE" ] && [ "$RATE" != "null" ]; then
              # 验证汇率在合理范围（1-20）
              RATE_OK=$(echo "$RATE > 1 && $RATE < 20" | bc -l 2>/dev/null || echo 0)
              if [ "$RATE_OK" = "1" ]; then
                echo "✅ USD/CNY = $RATE (published: $LAST_DATE)"
                break
              fi
            fi

            echo "⚠️  Invalid response, retry $i/3..."
            sleep 5
            RATE=""
          done

          if [ -z "$RATE" ] || [ "$RATE" = "null" ]; then
            echo "❌ Failed to fetch rate after 3 attempts, skipping update"
            exit 0
          fi

          # 使用中国日期（UTC+8）
          D=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          T=$(TZ='Asia/Shanghai' date +%Y-%m-%dT%H:%M:%S+08:00)

          printf '{"USD/CNY":%s,"date":"%s","source":"中国外汇交易中心","updated":"%s"}\n' "$RATE" "$D" "$T" > rate.json
          echo "rate.json updated: $(cat rate.json)"

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add rate.json
          if git diff --staged --quiet; then
            echo "No change, skipping commit"
          else
            RATE=$(jq -r '.["USD/CNY"]' rate.json)
            D=$(jq -r '.date' rate.json)
            git commit -m "💰 sync: USD/CNY central parity rate ${RATE} (${D})"
            git push
            echo "✅ Pushed: rate = ${RATE}"
          fi
